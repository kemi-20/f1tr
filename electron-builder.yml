appId: com.f1tr.app
productName: F1 Race Engineer
copyright: MIT
# Publishing is controlled by the CI `--publish never` flag, not here, so the Release
# carries exactly the two installer exes (no win-unpacked/blockmap/latest.yml).
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - "!**/*.{map,ts}"
asar: true
extraResources:
  - from: resources/dsh-runtime
    to: dsh-runtime
    filter:
      - '**/*'
      - '!node.exe'
      - '!**/*.map'
      - '!**/*.ts'
      - '!**/lib/types/**'
      - '!package-lock.json'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: F1 Race Engineer
portable:
  artifactName: ${productName}-${version}-portable.${ext}
