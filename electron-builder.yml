appId: com.f1tr.app
productName: F1 Race Engineer
copyright: MIT
compression: maximum
electronLanguages:
  - en-US
  - zh-CN
# Publishing is controlled by the CI `--publish never` flag, not here, so the Release
# carries exactly the two installer exes (no win-unpacked/blockmap/latest.yml).
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - "!**/*.{map,ts}"
  - "!**/node_modules/.bin/**"
asar: true
afterPack: .github/prune-electron-gpu.cjs
extraResources:
  - from: resources/dsh-runtime
    to: dsh-runtime
    filter:
      - '**/*'
      - '!node.exe'
      - '!**/*.map'
      - '!**/*.ts'
      - '!package-lock.json'
      - '!**/.bin/**'
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: F1 Race Engineer
portable:
  artifactName: ${productName}-${version}-portable.${ext}
