name: Build & Package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Quick checks on every push/PR ──
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build (vite)
        run: npm run build

  # ── Windows packaging ──
  # On push: build portable only, upload as Actions artifact for download.
  # On tag (v*): also build NSIS installer and publish a GitHub Release with both.
  package-windows:
    needs: check
    permissions:
      contents: write
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Electron runtime
        # Electron 44 ships its downloader as the `install-electron` bin instead
        # of an npm lifecycle script.
        run: node node_modules/electron/install.js
      - name: Install private DSH runtime
        run: npm ci --prefix resources/dsh-runtime
      - name: Link only the OpenAI Chat Completions provider
        run: node .github/slim-dsh-provider.mjs
      - name: Remove unused DSH plugins and dependencies
        run: node .github/prune-dsh-runtime.mjs
      - name: Stage private DSH plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path resources/dsh-runtime/plugin -Force | Out-Null
          Copy-Item -Path resources/dsh-f1-plugin/*.mjs,resources/dsh-f1-plugin/*.md -Destination resources/dsh-runtime/plugin -Force
      - name: Smoke check pinned DSH runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $plugin = 'resources/dsh-runtime/plugin/index.mjs'
          if (-not (Test-Path -LiteralPath $plugin -PathType Leaf)) {
            throw "Staged DSH plugin is missing: $plugin"
          }

          & node --check $plugin
          if ($LASTEXITCODE -ne 0) {
            throw 'The staged DSH plugin failed Node syntax validation.'
          }
          $env:F1TR_DSH_EXEC_PATH = (Resolve-Path node_modules/electron/dist/electron.exe).Path
          & node .github/smoke-dsh.mjs
          if ($LASTEXITCODE -ne 0) {
            throw 'Pinned DSH runtime failed JSON-RPC initialization.'
          }
          & node .github/test-dsh-completions.mjs
          if ($LASTEXITCODE -ne 0) {
            throw 'Completions streaming and F1 tool round-trip failed.'
          }
      - name: Typecheck
        run: npm run typecheck
      - name: Build & package Windows (portable + NSIS)
        run: npm run build:win
      - name: Smoke check pruned Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Get-ChildItem -Path release -Directory -Recurse -Filter win-unpacked | Select-Object -First 1
          if (-not $unpacked) { throw 'Unpacked Windows app is missing.' }
          foreach ($name in @('dxcompiler.dll', 'dxil.dll', 'vk_swiftshader.dll', 'vk_swiftshader_icd.json', 'vulkan-1.dll')) {
            if (Test-Path -LiteralPath (Join-Path $unpacked.FullName $name)) { throw "GPU file was not pruned: $name" }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $unpacked.FullName 'd3dcompiler_47.dll'))) {
            throw 'Required D3D compiler was unexpectedly removed.'
          }
          $exe = Join-Path $unpacked.FullName 'F1 Race Engineer.exe'
          $smoke = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 10
            $smoke.Refresh()
            if ($smoke.HasExited) { throw "Pruned Windows app exited during startup: $($smoke.ExitCode)" }
          } finally {
            $smoke.Refresh()
            if (-not $smoke.HasExited) { Stop-Process -Id $smoke.Id -Force }
          }
      - name: Smoke check packaged DSH runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Get-ChildItem -Path release -Directory -Recurse -Filter win-unpacked | Select-Object -First 1
          if (-not $unpacked) { throw 'Unpacked Windows app is missing.' }
          $env:F1TR_DSH_RUNTIME_DIR = Join-Path $unpacked.FullName 'resources/dsh-runtime'
          $env:F1TR_DSH_EXEC_PATH = Join-Path $unpacked.FullName 'F1 Race Engineer.exe'
          & node .github/smoke-dsh.mjs
          if ($LASTEXITCODE -ne 0) {
            throw 'Packaged DSH runtime failed JSON-RPC initialization.'
          }
      - name: List built executables
        shell: pwsh
        run: Get-ChildItem -Recurse release -Filter "*.exe" | Select-Object FullName, Length

      # Always upload the PORTABLE exe as an Actions artifact (for quick download).
      - name: Upload portable exe
        uses: actions/upload-artifact@v7.0.1
        with:
          name: F1-Race-Engineer-Portable
          path: release/**/*portable*.exe
          if-no-files-found: error

      - name: Upload extracted app (no startup self-extraction)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: F1-Race-Engineer-Unpacked
          path: release/**/win-unpacked/**
          if-no-files-found: error

      # On a tag push: create a GitHub Release with BOTH portable + NSIS installer.
      - name: Publish GitHub Release with installer (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          PORTABLE=$(find release -name "*portable*.exe" | head -1)
          SETUP=$(find release -name "*Setup*.exe" | head -1)
          echo "portable=$PORTABLE  setup=$SETUP"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file .github/release-notes.md \
            "$PORTABLE" "$SETUP"
