# The SDK-minimal bundle includes coding capabilities. Disable them for this app.
- id: sandbox
  disabled: true
- id: sandbox-policy
  disabled: true
- id: subprocess
  disabled: true
- id: pty
  disabled: true
- id: terminal-bash
  disabled: true
- id: terminal-pwsh
  disabled: true
- id: persistent-bash
  disabled: true
- id: persistent-pwsh
  disabled: true
- id: jobs
  disabled: true
- id: mcp-resources
  disabled: true
- id: session-title
  disabled: true
- id: llm-deepseek
  disabled: true
# These three rows add metadata only to official DeepSeek API requests.
- id: deepseek-llm-api-extensions
  disabled: true
- id: session-log-deepseek
  disabled: true
- id: plugin-package-inventory-deepseek
  disabled: true
- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: false
    personaPrefix: !!js process.env.F1TR_PERSONA ?? 'You are an original F1 race engineer supporting a driver, not a real team employee.'
- insert:
    - id: race-llm
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          race-gateway:
            apiKeyEnv: F1TR_MODEL_KEY
            api: openai-completions
            baseURL: !!js process.env.F1TR_MODEL_URL
            models:
              - id: !!js process.env.F1TR_MODEL_NAME
                name: Race Engineer Model
                contextWindow: !!js Number(process.env.F1TR_CONTEXT_LIMIT) || 200000
                # Capability declaration only: these values pass through unchanged.
                reasoningEfforts:
                  off: none
                  low: low
                  high: high
                  max: max
    - id: race-token-meter
      name: '@deepseek-ai/dsh-token-meter'
    - id: race-compaction
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: race-tools
      name: ./plugin/index.mjs
